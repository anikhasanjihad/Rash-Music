name: Rash Music Build & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

    - name: Decode custom keystore (optional)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
        fi

    - name: Build release APK
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'IUXZXxB3aJkEFRrglyQ8dmGP' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'rashmusic' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'IUXZXxB3aJkEFRrglyQ8dmGP' }}
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalGmsRelease \
          -PappVersionCode=$((1000 + ${{ github.run_number }})) \
          -PappVersionName=1.0.${{ github.run_number }}

    - name: Collect APK
      run: |
        APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        echo "Built: $APK"
        cp "$APK" RashMusic.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rash-Music-APK
        path: RashMusic.apk

    - name: Publish GitHub Release (in-app update source)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="v1.0.${{ github.run_number }}"
        NOTES="$(git log -1 --pretty=%B)"
        gh release create "$TAG" RashMusic.apk \
          --title "Rash Music $TAG" \
          --notes "$NOTES" \
          --latest
